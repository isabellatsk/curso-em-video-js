<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documento Javascript</title>
    <style>
        body {
            font: normal 20pt arial ;
        }
    </style>
</head>
<body>
    <script>
        var nome = window.prompt('Digite o seu nome: ')
        document.write(`Olá, <strong>${nome}</strong> seu nome tem ${nome.length} letras<br>`) //document.write vai mostrar na tela, no fundo do site. e o length diz quantos caracteres tem
        document.write(`Seu nome em maiúsculas é ${nome.toUpperCase()}<br>`)
        document.write(`Seu nome em minúscula é ${nome.toLowerCase()}`)
    </script>
</body>
</html>
