<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documento Javascript</title>
    <style>
        body {background-color: rgb(141, 141, 216);
        color: blueviolet; /*comentario em css*/
        font: normal 20pt Arial;}
        h1 {color: rgb(96, 30, 158) ;}
    </style>
</head>
<body>
    <h1>Olá, mundo!</h1>
    <p>Meu parágrafo!</p>
    <script>
      var n1 = Number.parseInt(window.prompt('Digite o primeiro número: '))
      var n2 = Number.parseInt(window.prompt('Digite o segundo número: '))
      var s = n1 + n2
      window.alert(`A soma entre ${n1} e ${n2} é igual a ${s}`)
      //number + number para adição
      //string + string para concatenação
      //window.prompt retorna como string e não number
      //float, decimal
      //Int, inteiro
    </script>
</body>
</html>
